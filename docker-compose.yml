version: '3.8'

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ojt_user
      POSTGRES_PASSWORD: ojt_password
      POSTGRES_DB: ojt_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ojt_user
      DB_PASSWORD: ojt_password
      DB_NAME: ojt_system
      JWT_SECRET: change_this_to_a_strong_secret
      PORT: 8080
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://localhost:8080/api

volumes:
  postgres_data:
